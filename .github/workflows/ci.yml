name: CI

# Public tap: GitHub-hosted runners are free here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# brew audit --online calls the GitHub API; unauthenticated calls from shared runner
# IPs hit the anonymous rate limit. The built-in read-only token lifts it.
env:
  HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  cask:
    # Explicit image, never *-latest.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tap this checkout
        run: brew tap consolelabs/tap "$GITHUB_WORKSPACE"
      - name: Trust this tap
        run: brew trust consolelabs/tap
      - name: Audit
        run: brew audit --cask --strict --online consolelabs/tap/spacedown
      - name: Install
        run: brew install --cask consolelabs/tap/spacedown
      - name: Check the app
        run: test -d /Applications/Spacedown.app && spctl -a -vv -t exec /Applications/Spacedown.app

  formula:
    # Explicit image, never *-latest.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tap this checkout
        run: brew tap consolelabs/tap "$GITHUB_WORKSPACE"
      - name: Trust this tap
        run: brew trust consolelabs/tap
      - name: Audit
        run: brew audit --strict --online consolelabs/tap/handout && brew audit --cask --strict --online consolelabs/tap/handout-bar
      - name: Install
        run: brew install consolelabs/tap/handout
      - name: Test
        run: brew test consolelabs/tap/handout
